# Rotation for the AmpliconRepository application logs.
#
# Install as /etc/logrotate.d/ampliconrepo on the dev and prod servers. The
# glob covers AmpliconRepository-dev and -prod alike, so the file is identical
# on either box.
#
# Four files land in the logs/ directory the container bind-mounts at
# /srv/logs: gunicorn writes gunicorn_access.log and gunicorn_error.log from
# gunicorn_config.py, --log-file writes gunicorn.log, and stdout.txt is the tee
# in run-manage-py.sh. All four are opened in append mode, which is what makes
# copytruncate safe here: an appending writer seeks to the end on every write,
# so it picks up a truncated file without a restart and without reopening its
# handle. The cost is the sub-second window between copy and truncate, in which
# a line can be lost -- acceptable for an access log, and the alternative is
# worse: gunicorn would honour a USR1 to reopen its own files, but tee cannot
# be told to reopen at all, so stdout.txt would need copytruncate regardless
# and the config would carry two mechanisms to save one log line.
#
# Weekly rather than daily because these grow at roughly 9 MB/day (access) and
# 5 MB/day (stdout): daily would leave 90 files of a few megabytes each to say
# what 13 files can.
#
# Twelve rotations, so roughly three months of history. The access log records a
# client IP, request line, referrer, and user-agent for every hit, which is
# personal data we have no operational reason to keep for a year -- a quarter is
# well past the point where anyone is still debugging an incident or chasing an
# abusive scraper. Keeping less of it is the whole point; the disk it saves is
# incidental, since these are repetitive text and gzip takes them down more than
# tenfold either way.

/home/ubuntu/AmpliconRepository-*/logs/*.log
/home/ubuntu/AmpliconRepository-*/logs/stdout.txt {
    weekly
    rotate 12

    # A burst rotates early instead of waiting for Sunday. logrotate itself
    # runs daily from its systemd timer, so this reads as a daily ceiling: a
    # normal week rotates on schedule at ~60 MB, and a scanner storm cannot
    # carry a file past roughly 500 MB plus one day's growth. Because the timer
    # is daily, no file can rotate twice in a day, so the dated names below
    # cannot collide.
    maxsize 500M

    compress
    missingok
    notifempty
    copytruncate

    # Dated rather than numbered: gunicorn_access.log-2026-08-19.gz says when to
    # look, and the numbering scheme does not.
    dateext
    dateformat -%Y-%m-%d

    # The logs directory belongs to ubuntu and is group-writable, so logrotate
    # will not act on it until it is told whose privileges to use.
    su root root
}
