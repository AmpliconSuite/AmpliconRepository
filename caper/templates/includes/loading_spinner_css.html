{% comment %}
A small ring spinner for "Loading ..." placeholders. It turns by transform
only, which the compositor animates on its own thread, so it keeps turning
while the main thread is blocked building a large table -- the moment a
placeholder is actually on screen.
{% endcomment %}
<style>
    .loading-spinner {
        display: inline-block;
        width: 1em;
        height: 1em;
        margin-right: 0.5em;
        vertical-align: -0.15em;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: loading-spinner-turn 0.75s linear infinite;
    }

    @keyframes loading-spinner-turn {
        to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
        .loading-spinner {
            animation-duration: 2s;
        }
    }
</style>
