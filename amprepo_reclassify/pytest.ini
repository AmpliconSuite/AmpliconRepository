[pytest]
# The reclassifier's own tests. They don't use the site, Django or its database, and this file
# keeps pytest from loading the repo's conftest.py, which starts Django for the site's tests.
# Run from the repo root: python -m pytest amprepo_reclassify
testpaths = tests
pythonpath = ..
addopts = -p no:logfire -p no:django -p no:dash -q --tb=short -r a
