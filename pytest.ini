[pytest]
# Test discovery
testpaths = tests

# The scripts under test are plain files, not a package, so they are imported by
# name; this is what puts their directories on sys.path.  Add a directory here
# when a new scripts/ subdirectory gains a tested script.
pythonpath =
    scripts/maintenance
    scripts/diagnostics
    scripts/dev
    scripts/memory_auditing

# Marks used in this project
markers =
    slow: marks tests that run the full aggregation pipeline (may take several minutes)
    integration: marks tests that require a live MongoDB connection
    functional: end-to-end tests that depend on the loaded_datasets fixture
    browser: Playwright browser tests (requires a running dev server)
    performance: benchmarking only; use scripts/dev/performance_test.py directly instead
    throttled: test needs real /api/v1/ rate limiting; opts out of the conftest fixture that disables it

# Disable broken third-party pytest plugins in the global Python environment.
# -q          : compact output
# --tb=short  : short tracebacks
# -r a        : always show the full A(ll) result summary at the end
addopts = -p no:logfire -p no:django -p no:dash -q --tb=short -r a -W ignore
