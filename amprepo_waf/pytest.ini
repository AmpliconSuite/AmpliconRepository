[pytest]
# The WAF tool's own tests. They don't use the site, Django, its database or AWS, and this
# file keeps pytest from loading the repo's conftest.py, which starts Django.
# Run from the repo root: python -m pytest amprepo_waf
testpaths = tests
pythonpath = ..
addopts = -p no:logfire -p no:django -p no:dash -q --tb=short -r a
